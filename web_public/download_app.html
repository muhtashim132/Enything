<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App - Enything</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #04091E 0%, #02061A 50%, #120860 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        .icon-box {
            width: 100px;
            height: 100px;
            background: rgba(91, 139, 255, 0.1);
            border-radius: 50%;
            border: 2px solid #5B8BFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #5B8BFF;
            margin: 0 auto 2rem auto;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 1rem 2rem;
            background: #5B8BFF;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #4775e6;
            transform: translateY(-2px);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 1rem 2rem;
            background: transparent;
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-left: 1rem;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box" id="role-icon">
            <i class="fas fa-mobile-alt"></i>
        </div>
        <h1 id="page-title">Please Download the App</h1>
        <p id="page-desc">The Enything web experience is currently optimized for shoppers. To access your Seller or Delivery Partner dashboard and manage your account, please download the official Enything Mobile App.</p>
        
        <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 15px;">
            <a href="#" class="btn-primary"><i class="fab fa-google-play"></i> Get it on Google Play</a>
            <a href="#" class="btn-primary"><i class="fab fa-apple"></i> Download on App Store</a>
        </div>
        
        <div style="margin-top: 3rem;">
            <a href="index.html" class="btn-outline"><i class="fas fa-arrow-left"></i> Return to Homepage</a>
        </div>
    </div>
    
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const role = localStorage.getItem('user_role');
            if (role === 'seller') {
                document.getElementById('page-title').textContent = 'Seller Dashboard';
                document.getElementById('page-desc').textContent = 'To manage your shop, view analytics, and accept incoming orders, please log in through the Enything Mobile App.';
                document.getElementById('role-icon').innerHTML = '<i class="fas fa-store"></i>';
            } else if (role === 'delivery_partner') {
                document.getElementById('page-title').textContent = 'Rider Dashboard';
                document.getElementById('page-desc').textContent = 'To start receiving delivery requests, track earnings, and navigate to customers, please log in through the Enything Mobile App.';
                document.getElementById('role-icon').innerHTML = '<i class="fas fa-motorcycle"></i>';
            }
        });
    </script>
</body>
</html>
