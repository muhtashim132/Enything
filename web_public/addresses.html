<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addresses - Enything</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Enything Logo" class="logo-img">
            <span class="logo-text">Enything</span>
        </a>
        <nav style="display: flex; align-items: center; width: 100%; justify-content: flex-end;">
            <div id="location-container" style="margin-right: auto; margin-left: 1rem; display: flex; align-items: center;"></div>
            <span id="auth-container" style="margin-left: 2rem;"></span>
        </nav>
    </header>

    <main style="padding-top: 100px;">
        <div id="addresses-container" style="max-width: 800px; margin: 0 auto; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>My Addresses</h1>
                <button onclick="openAddressModal()" class="btn-primary" style="padding: 0.5rem 1rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; color: white;">
                    <i class="fas fa-plus"></i> Add New Address
                </button>
            </div>
            
            <div id="address-list" style="display: flex; flex-direction: column; gap: 1rem;">
                <p style="text-align: center; color: var(--text-muted); font-size: 1.2rem;">Loading addresses...</p>
            </div>
        </div>

        <!-- Address Modal -->
        <div id="address-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
            <div style="background: var(--bg-color); width: 90%; max-width: 500px; border-radius: 16px; border: 1px solid var(--glass-border); padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                <h2 id="modal-title" style="margin-top: 0; margin-bottom: 1.5rem;">Add New Address</h2>
                <form id="address-form" onsubmit="saveAddress(event)">
                    <input type="hidden" id="addr-id">
                    
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Address Label</label>
                        <select id="addr-label" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white;">
                            <option value="Home" style="color: black;">Home</option>
                            <option value="Work" style="color: black;">Work</option>
                            <option value="Other" style="color: black;">Other</option>
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Full Address</label>
                        <button type="button" onclick="pickLiveLocation()" style="width: 100%; padding: 0.8rem; margin-bottom: 0.8rem; border-radius: 8px; border: 1px solid var(--accent-color); background: rgba(91, 139, 255, 0.1); color: var(--accent-color); font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;">
                            <i class="fas fa-location-arrow"></i> <span id="loc-btn-text">Pick Live Location</span>
                        </button>
                        <textarea id="addr-text" required rows="3" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white; resize: none;" placeholder="123 Main St, City..."></textarea>
                    </div>
                    
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Landmark (Optional)</label>
                        <input type="text" id="addr-landmark" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white;" placeholder="Near City Mall">
                    </div>
                    
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" onclick="closeAddressModal()" style="padding: 0.8rem 1.5rem; border-radius: 8px; border: 1px solid var(--glass-border); background: transparent; color: white; cursor: pointer;">Cancel</button>
                        <button type="submit" id="save-addr-btn" style="padding: 0.8rem 1.5rem; border-radius: 8px; border: none; background: var(--accent-color); color: white; cursor: pointer; font-weight: 600;">Save Address</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/supabase-client.js?v=2"></script>
    <script src="js/auth.js?v=10"></script>

    <script>
        let addresses = [];

        async function loadAddresses() {
            const container = document.getElementById('address-list');
            if (!auth.user) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Please login to view your addresses.</p>';
                return;
            }

            try {
                // Fetch profile for name and phone
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, phone')
                    .eq('id', auth.user.id)
                    .maybeSingle();

                const userName = profile?.full_name || 'Customer';
                const userPhone = profile?.phone || auth.user.phone || '';

                const { data, error } = await supabaseClient
                    .from('saved_addresses')
                    .select('*')
                    .eq('user_id', auth.user.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                addresses = data || [];

                if (addresses.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No saved addresses found.</p>';
                    return;
                }

                container.innerHTML = addresses.map(addr => `
                    <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 1.5rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h3 style="margin: 0 0 0.5rem 0; color: #5B8BFF; display: flex; align-items: center; gap: 8px;">
                                <i class="fas fa-map-marker-alt"></i> ${addr.label || 'Location'}
                            </h3>
                            <div style="margin-bottom: 0.5rem;">
                                <strong style="color: var(--text-main); font-size: 1.1rem; display: block; margin-bottom: 2px;">${userName}</strong>
                                <span style="color: var(--text-muted); font-size: 0.9rem;">${userPhone}</span>
                            </div>
                            <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem; line-height: 1.4;">${addr.address}</p>
                            ${addr.landmark ? `<p style="margin: 0.25rem 0 0 0; color: var(--accent-color); font-size: 0.85rem;"><i class="fas fa-location-arrow" style="font-size: 0.8rem; margin-right: 4px;"></i> Landmark: ${addr.landmark}</p>` : ''}
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button onclick="openAddressModal('${addr.id}')" style="background: none; border: 1px solid var(--glass-border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s;"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteAddress('${addr.id}')" style="background: none; border: 1px solid #ef4444; color: #ef4444; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="text-align: center; color: #ef4444;">Failed to load addresses.</p>';
            }
        }

        function openAddressModal(id = null) {
            const modal = document.getElementById('address-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('address-form');
            
            form.reset();
            document.getElementById('loc-btn-text').textContent = 'Pick Live Location';
            
            if (id) {
                const addr = addresses.find(a => a.id === id);
                if (addr) {
                    title.textContent = 'Edit Address';
                    document.getElementById('addr-id').value = id;
                    document.getElementById('addr-label').value = addr.label || 'Home';
                    document.getElementById('addr-text').value = addr.address || '';
                    document.getElementById('addr-landmark').value = addr.landmark || '';
                }
            } else {
                title.textContent = 'Add New Address';
                document.getElementById('addr-id').value = '';
            }
            
            modal.style.display = 'flex';
        }
        
        function closeAddressModal() {
            document.getElementById('address-modal').style.display = 'none';
        }
        
        async function saveAddress(e) {
            e.preventDefault();
            const btn = document.getElementById('save-addr-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Saving...';
            btn.disabled = true;
            
            const id = document.getElementById('addr-id').value;
            const label = document.getElementById('addr-label').value;
            const address = document.getElementById('addr-text').value;
            const landmark = document.getElementById('addr-landmark').value;
            
            try {
                if (id) {
                    const { error } = await supabaseClient
                        .from('saved_addresses')
                        .update({ label, address, landmark })
                        .eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient
                        .from('saved_addresses')
                        .insert({ user_id: auth.user.id, label, address, landmark });
                    if (error) throw error;
                }
                
                closeAddressModal();
                loadAddresses();
            } catch (err) {
                console.error("Save error", err);
                alert("Failed to save address. Check console for details.");
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
        
        async function deleteAddress(id) {
            if (!confirm('Are you sure you want to delete this address?')) return;
            try {
                const { error } = await supabaseClient
                    .from('saved_addresses')
                    .delete()
                    .eq('id', id);
                if (error) throw error;
                loadAddresses();
            } catch (err) {
                console.error("Delete error", err);
                alert("Failed to delete address.");
            }
        }
        
        function pickLiveLocation() {
            const btnText = document.getElementById('loc-btn-text');
            btnText.textContent = 'Getting location...';
            
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                btnText.textContent = 'Pick Live Location';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                try {
                    btnText.textContent = 'Resolving address...';
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await res.json();
                    
                    if (data && data.display_name) {
                        document.getElementById('addr-text').value = data.display_name;
                        btnText.textContent = 'Location Applied!';
                        setTimeout(() => btnText.textContent = 'Pick Live Location', 3000);
                    } else {
                        throw new Error("No address found");
                    }
                } catch (err) {
                    console.error("Geocoding error", err);
                    alert("Failed to resolve address from coordinates.");
                    document.getElementById('addr-text').value = `${lat}, ${lon}`;
                    btnText.textContent = 'Pick Live Location';
                }
            }, (error) => {
                console.error("Geolocation error", error);
                alert("Unable to retrieve your location. Please allow location access.");
                btnText.textContent = 'Pick Live Location';
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadAddresses, 500);
        });
    </script>
</body>
</html>
