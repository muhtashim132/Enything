<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Enything</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .checkout-container {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 4rem;
            margin-top: 2rem;
        }

        @media (max-width: 900px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        .checkout-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
        }

        .checkout-section h2 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--text-muted);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .pay-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 2rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .pay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        /* Success Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .success-modal {
            background: var(--secondary-color);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon {
            font-size: 4rem;
            color: #4ade80;
            margin-bottom: 1rem;
        }

    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Enything Logo" class="logo-img">
            <span class="logo-text">Enything</span>
        </a>
    </header>

    <main>
        <div class="checkout-container">
            <!-- Left: Delivery Details -->
            <div class="checkout-section">
                <h2>Delivery Details</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="cust-name" class="form-control" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="cust-phone" class="form-control" required placeholder="+91 9876543210">
                    </div>
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                            <label style="margin: 0;">Delivery Address</label>
                            <div style="display: flex; gap: 8px;">
                                <button type="button" onclick="getLiveLocation()" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--accent-color); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px;">
                                    <i class="fas fa-location-crosshairs"></i> Live Location
                                </button>
                                <button type="button" onclick="showSavedAddressesModal()" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px;">
                                    <i class="fas fa-bookmark"></i> Saved
                                </button>
                            </div>
                        </div>
                        <textarea id="cust-address" class="form-control" required rows="3" placeholder="123 Main Street, Bandipora"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Landmark (Optional)</label>
                        <input type="text" id="cust-landmark" class="form-control" placeholder="Near XYZ Hospital">
                    </div>
                </form>
            </div>

            <!-- Right: Order Summary -->
            <div class="checkout-section">
                <h2>Order Summary</h2>
                <div id="checkout-items"></div>
                
                <div class="summary-item" style="margin-top: 1.5rem;">
                    <span>Item Total</span>
                    <span id="summary-subtotal">₹0.00</span>
                </div>
                <div class="summary-item">
                    <span>Delivery Fee</span>
                    <span>₹30.00</span>
                </div>
                <div class="summary-item">
                    <span>Handling Fee</span>
                    <span>₹20.00</span>
                </div>
                <div class="summary-item">
                    <span>Taxes (GST)</span>
                    <span id="summary-taxes">₹0.00</span>
                </div>
                
                <div class="summary-total">
                    <span>To Pay</span>
                    <span id="summary-total">₹0.00</span>
                </div>

                <button id="pay-button" class="pay-btn">
                    <i class="fas fa-lock"></i> Pay Securely
                </button>
            </div>
        </div>
    </main>

    <!-- Saved Addresses Modal -->
    <div id="saved-addresses-modal" class="modal-overlay" style="display: none; z-index: 1001;">
        <div class="success-modal" style="text-align: left; padding: 2rem; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="font-size: 1.5rem; margin: 0;">Saved Addresses</h2>
                <button onclick="document.getElementById('saved-addresses-modal').style.display='none'" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem;"><i class="fas fa-times"></i></button>
            </div>
            <div id="saved-addresses-list" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Addresses injected here -->
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="modal-overlay">
        <div class="success-modal">
            <i class="fas fa-check-circle success-icon"></i>
            <h2 style="font-size: 2rem; margin-bottom: 1rem;">Order Placed!</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Your payment was successful and your order is on the way.</p>
            <a href="index.html" class="btn btn-primary" style="width: 100%;">Return to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tax_config.js"></script>
    <script src="js/cart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            if (cart.items.length === 0) {
                window.location.href = 'index.html';
                return;
            }
            
            // Wait for Supabase to be ready and check auth
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            // Autofill user details
            try {
                // Fetch profile
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, phone')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (profile && profile.full_name) {
                    document.getElementById('cust-name').value = profile.full_name;
                }
                
                let extractedPhone = '';
                if (session.user?.email && session.user.email.endsWith('@enything.com')) {
                    extractedPhone = session.user.email.split('@')[0];
                    if (extractedPhone.startsWith('mock')) {
                        extractedPhone = '+' + extractedPhone.substring(4);
                    }
                }
                
                const userPhone = extractedPhone || session.user?.phone || session.user?.user_metadata?.phone || (profile && profile.phone) || '';
                if (userPhone) {
                    document.getElementById('cust-phone').value = userPhone;
                }
                
                // Make the phone field readonly so they cannot edit their verified number
                document.getElementById('cust-phone').readOnly = true;
                document.getElementById('cust-phone').style.background = 'rgba(0,0,0,0.2)';
                document.getElementById('cust-phone').style.cursor = 'not-allowed';

                // Fetch most recent address
                const { data: addressData } = await supabaseClient
                    .from('saved_addresses')
                    .select('address, landmark')
                    .eq('user_id', session.user.id)
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .maybeSingle();
                
                if (addressData) {
                    if (addressData.address) document.getElementById('cust-address').value = addressData.address;
                    if (addressData.landmark) document.getElementById('cust-landmark').value = addressData.landmark;
                }
            } catch (e) {
                console.error("Error autofilling details:", e);
            }

            const itemsContainer = document.getElementById('checkout-items');
            cart.items.forEach(item => {
                const price = item.price;
                itemsContainer.innerHTML += `
                    <div class="summary-item">
                        <a href="product.html?id=${item.id}" style="text-decoration: none; color: inherit; cursor: pointer; transition: color 0.2s;" onmouseover="this.style.color='var(--accent-color)'" onmouseout="this.style.color='inherit'">
                            ${item.quantity}x ${item.name}
                        </a>
                        <span>₹${(price * item.quantity).toFixed(2)}</span>
                    </div>
                `;
            });

            const subtotal = cart.getTotal();
            const gst = cart.getGSTTotal();
            const deliveryFee = 30.00;
            const handlingFee = 20.00;
            const total = subtotal + gst + deliveryFee + handlingFee;

            document.getElementById('summary-subtotal').textContent = `₹${subtotal.toFixed(2)}`;
            document.getElementById('summary-taxes').textContent = `₹${gst.toFixed(2)}`;
            document.getElementById('summary-total').textContent = `₹${total.toFixed(2)}`;

            document.getElementById('pay-button').addEventListener('click', (e) => {
                e.preventDefault();
                
                const form = document.getElementById('checkout-form');
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                // Initialize Razorpay
                const options = {
                    "key": CONFIG.RAZORPAY_TEST_KEY,
                    "amount": Math.round(total * 100), // amount in paise
                    "currency": "INR",
                    "name": "Enything Technologies",
                    "description": "Dummy Order Checkout",
                    "image": "logo.png",
                    "handler": function (response) {
                        // On Success
                        cart.clear();
                        document.getElementById('success-modal').style.display = 'flex';
                    },
                    "prefill": {
                        "name": document.getElementById('cust-name').value,
                        "contact": document.getElementById('cust-phone').value,
                        "email": "test@enything.in"
                    },
                    "theme": {
                        "color": "#3b82f6"
                    }
                };
                const rzp = new Razorpay(options);
                rzp.open();
            });
        });

        async function getLiveLocation() {
            const btn = document.querySelector('button[onclick="getLiveLocation()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Locating...';
            btn.disabled = true;

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                btn.innerHTML = originalText;
                btn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await response.json();
                    if (data && data.display_name) {
                        document.getElementById('cust-address').value = data.display_name;
                    } else {
                        alert("Could not fetch address details for your location.");
                    }
                } catch (e) {
                    alert("Failed to fetch address. Please try again.");
                } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }, (error) => {
                alert("Location access denied or unavailable.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        async function showSavedAddressesModal() {
            if (!auth.user) return;
            const list = document.getElementById('saved-addresses-list');
            list.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Loading...</p>';
            document.getElementById('saved-addresses-modal').style.display = 'flex';
            
            try {
                const { data, error } = await supabaseClient
                    .from('saved_addresses')
                    .select('*')
                    .eq('user_id', auth.user.id)
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                if (!data || data.length === 0) {
                    list.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No saved addresses found.</p>';
                    return;
                }
                
                list.innerHTML = data.map(addr => `
                    <div onclick="selectAddress('${addr.address.replace(/'/g, "\\'")}', '${(addr.landmark || '').replace(/'/g, "\\'")}')" style="background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 8px; cursor: pointer; transition: 0.2s;">
                        <h4 style="margin: 0 0 4px 0; color: #5B8BFF;"><i class="fas fa-map-marker-alt"></i> ${addr.label || 'Location'}</h4>
                        <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem; line-height: 1.4;">${addr.address}</p>
                        ${addr.landmark ? `<p style="margin: 4px 0 0 0; color: var(--accent-color); font-size: 0.8rem;"><i class="fas fa-location-arrow"></i> ${addr.landmark}</p>` : ''}
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<p style="color: #ef4444; text-align: center;">Failed to load addresses.</p>';
            }
        }

        function selectAddress(address, landmark) {
            document.getElementById('cust-address').value = address;
            document.getElementById('cust-landmark').value = landmark;
            document.getElementById('saved-addresses-modal').style.display = 'none';
        }
    </script>
</body>
</html>
