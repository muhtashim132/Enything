<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recently Visited - Enything</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .shop-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 3rem;
            padding: 2rem;
            background: var(--glass-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }
        
        .shop-image {
            width: 150px;
            height: 150px;
            border-radius: 15px;
            object-fit: cover;
            border: 2px solid var(--glass-border);
        }

        .shop-details h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .shop-details p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .menu-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
        }

        @media (max-width: 900px) {
            .menu-container {
                grid-template-columns: 1fr;
            }
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
            .shop-header {
                flex-direction: column;
                text-align: center;
            }
        }
        @media (max-width: 400px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.8rem;
            }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 1rem;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price-container {
            display: flex;
            flex-direction: column;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-color);
            background: none;
            padding: 0;
        }

        .original-price {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .add-to-cart {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .add-to-cart:hover {
            transform: scale(1.05);
        }

        .add-to-cart:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            position: sticky;
            top: 100px;
            height: fit-content;
            max-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .cart-items-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .cart-item-details h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .cart-item-details span {
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 4px;
        }

        .cart-item-actions button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .cart-item-actions button:hover {
            background: rgba(255,255,255,0.1);
        }

        .cart-footer {
            border-top: 1px solid var(--glass-border);
            padding-top: 1.5rem;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .checkout-btn:hover:not(:disabled) {
            opacity: 0.9;
        }
        
        .checkout-btn:disabled {
            background: #444;
            cursor: not-allowed;
            color: #888;
        }

        .veg-icon {
            width: 12px;
            height: 12px;
            display: inline-block;
            border: 1px solid #4ade80;
            margin-right: 6px;
            position: relative;
        }
        .veg-icon::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: #4ade80;
            border-radius: 50%;
        }
        .non-veg-icon {
            border-color: #f87171;
        }
        .non-veg-icon::after {
            background: #f87171;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Enything Logo" class="logo-img">
            <span class="logo-text">Enything</span>
        </a>
        <nav style="display: flex; align-items: center; width: 100%; justify-content: flex-end;">
            <div id="location-container" style="margin-right: auto; margin-left: 1rem; display: flex; align-items: center;"></div>
            <div style="position: relative; margin-left: 2rem;">
                <a href="cart.html" style="margin-left:0; color:var(--text-main);"><i class="fas fa-shopping-cart"></i></a>
                <span id="cart-count" style="position: absolute; top: -10px; right: -10px; background: var(--accent-color); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.7rem; display: none; align-items: center; justify-content: center; font-weight: bold;">0</span>
            </div>
            <span id="auth-container" style="margin-left: 2rem;"></span>
        </nav>
    </header>

    <main>
        <div id="search-header-container" style="margin-bottom: 2rem;">
            <p style="text-align: center; color: var(--text-muted); font-size: 1.2rem;">Searching...</p>
        </div>

        <div class="menu-container">
            <div>
                <div id="products-grid" class="products-grid">
                    <div class="loader-container">
                        <div class="spinner"></div>
                    </div>
                </div>
                <div id="load-more-container" style="text-align: center; margin-top: 2rem; display: none;">
                    <button class="checkout-btn" style="width: auto; padding: 0.8rem 3rem;" onclick="loadMoreProducts()">See More</button>
                </div>
            </div>
            
            <div class="cart-sidebar">
                <div class="cart-header">Your Cart</div>
                <div id="cart-items" class="cart-items-container">
                    <!-- Cart items will be injected here -->
                </div>
                <div class="cart-footer">
                    <div class="cart-total-row" style="display: block;">
                        <div id="cart-total" style="width: 100%;">₹0.00</div>
                    </div>
                    <button id="checkout-btn" class="checkout-btn" onclick="window.location.href='checkout.html'" disabled>Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Supabase & Cart JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js?v=11"></script>
    <script src="js/tax_config.js"></script>
    <script src="js/cart.js"></script>

    <script>
        let allProducts = [];
        let recentIds = [];
        let currentDisplayedCount = 8;

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('search-header-container').innerHTML = `<h1>Recently Visited</h1>`;

            try {
                if (window.supabaseInitError) throw window.supabaseInitError;

                const { data: products, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('is_deleted', false)
                    .eq('is_available', true);
                    
                if (error) throw error;
                
                if (products) {
                    allProducts = products;
                }
                
                recentIds = JSON.parse(localStorage.getItem('recently_visited') || '[]');
                
                renderProducts();
            } catch (err) {
                console.error(err);
                document.querySelector('.menu-container').innerHTML = `<div style="color: #f87171; text-align: center; padding: 2rem; background: rgba(255,0,0,0.1); border-radius: 10px; border: 1px solid rgba(255,0,0,0.2); width: 100%;">
                    <h3 style="margin-bottom: 0.5rem;">Failed to load products</h3>
                </div>`;
            }
        });
        
        function renderProducts(isLoadMore = false) {
            const container = document.getElementById('products-grid');
            const loadMoreBtn = document.getElementById('load-more-container');
            
            window.renderedProductsMap = window.renderedProductsMap || {};
            
            if (!isLoadMore) {
                container.innerHTML = '';
                currentDisplayedCount = 8;
                window.renderedProductsMap = {};
            }
            
            const recentProducts = recentIds.map(id => allProducts.find(p => p.id === id)).filter(p => p);
            
            if (!recentProducts || recentProducts.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align:center; padding: 3rem;">No recently visited products.</p>';
                if(loadMoreBtn) loadMoreBtn.style.display = 'none';
                return;
            }

            const startIndex = isLoadMore ? currentDisplayedCount - 8 : 0;
            const endIndex = Math.min(currentDisplayedCount, recentProducts.length);
            const productsToShow = recentProducts.slice(startIndex, endIndex);

            productsToShow.forEach(product => {
                const price = product.price;
                const originalPriceHtml = product.original_price ? `<span class="original-price">₹${product.original_price}</span>` : '';
                
                let imageUrl = 'https://via.placeholder.com/300x200?text=No+Image';
                if (product.images && product.images.length > 0) imageUrl = product.images[0];
                else if (product.image_url) imageUrl = product.image_url;
                
                const vegIcon = product.is_veg === true ? '<div class="veg-icon"></div>' : (product.is_veg === false ? '<div class="veg-icon non-veg-icon"></div>' : '');
                const hasVariants = product.variants && Array.isArray(product.variants) && product.variants.length > 0;
                
                let buttonHtml;
                if (hasVariants) {
                    buttonHtml = `<button class="add-to-cart" onclick="window.location.href='product.html?id=${product.id}'">Options</button>`;
                } else {
                    buttonHtml = `<button class="add-to-cart" onclick='cart.addItem(${JSON.stringify(product).replace(/'/g, "&#39;")}, "${product.shop_id}")'>Add +</button>`;
                }

                container.innerHTML += `
                    <div class="product-card">
                        <a href="product.html?id=${product.id}" style="text-decoration: none; color: inherit; display: block;">
                            <img src="${imageUrl}" alt="${product.name}" class="product-image">
                            <div class="product-info">
                                <div class="product-name">${vegIcon}${product.name}</div>
                                <div class="product-desc" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${product.description || ''}</div>
                            </div>
                        </a>
                        <div class="product-footer">
                            <div class="price-container">
                                ${originalPriceHtml}
                                <span class="price">₹${price}</span>
                            </div>
                            <div class="product-action-container" id="action-container-${product.id}">
                                ${getActionButtonHtml(product)}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            if (currentDisplayedCount < recentProducts.length) {
                if(loadMoreBtn) loadMoreBtn.style.display = 'block';
            } else {
                if(loadMoreBtn) loadMoreBtn.style.display = 'none';
            }
        }
        
        function getActionButtonHtml(product) {
            window.renderedProductsMap[product.id] = product;
            
            const hasVariants = product.variants && Array.isArray(product.variants) && product.variants.length > 0;
            if (hasVariants) {
                return `<button class="add-to-cart" onclick="window.location.href='product.html?id=${product.id}'">Options</button>`;
            }
            
            if (!product.is_available) {
                return `<button class="add-to-cart" disabled>Out of stock</button>`;
            }
            
            const cartItem = cart.items.find(i => i.id === product.id);
            if (cartItem && cartItem.quantity > 0) {
                return `
                    <div class="cart-qty-controls" style="display: flex; align-items: center; justify-content: space-between; background: rgba(91, 139, 255, 0.1); border: 1px solid var(--accent-color); border-radius: 8px; overflow: hidden; height: 35px; width: 80px;">
                        <button onclick='event.preventDefault(); event.stopPropagation(); cart.updateQuantity("${product.id}", -1)' style="background: none; border: none; color: white; padding: 0 8px; cursor: pointer; height: 100%; display: flex; align-items: center;"><i class="fas fa-minus" style="font-size: 0.7rem;"></i></button>
                        <span style="color: white; font-weight: 600; font-size: 0.9rem;">${cartItem.quantity}</span>
                        <button onclick='event.preventDefault(); event.stopPropagation(); cart.updateQuantity("${product.id}", 1)' style="background: none; border: none; color: white; padding: 0 8px; cursor: pointer; height: 100%; display: flex; align-items: center;"><i class="fas fa-plus" style="font-size: 0.7rem;"></i></button>
                    </div>
                `;
            } else {
                return `<button class="add-to-cart" onclick='event.preventDefault(); event.stopPropagation(); cart.addItem(${JSON.stringify(product).replace(/'/g, "&#39;")}, "${product.shop_id}")'>Add +</button>`;
            }
        }
        
        window.addEventListener('cartUpdated', () => {
            if (window.renderedProductsMap) {
                Object.values(window.renderedProductsMap).forEach(product => {
                    const container = document.getElementById(`action-container-${product.id}`);
                    if (container) {
                        container.innerHTML = getActionButtonHtml(product);
                    }
                });
            }
        });
        
        window.loadMoreProducts = function() {
            currentDisplayedCount += 8;
            renderProducts(true);
        };
    </script>
</body>
</html>
